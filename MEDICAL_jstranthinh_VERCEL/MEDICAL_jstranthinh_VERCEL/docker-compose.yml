# Local development stack only. Do not reuse these credentials in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medical_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - medical_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/medical_booking
      JWT_SECRET: local-docker-secret-change-before-production-123456
      CORS_ORIGIN: http://localhost:5173
      PATIENT_CANCELLATION_MIN_HOURS: 2
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  medical_postgres_data:
